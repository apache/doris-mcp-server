[project]
name = "doris-new-mcp"
version = "1.3.1"
description = "Apache Doris MCP Server — Doris query service over the MCP protocol, with a built-in MetricFlow semantic layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiomysql>=0.3.2",
    "authlib>=1.7.2",
    "cryptography>=45.0.1",
    "fastmcp>=3.3.1",
    "httpx>=0.27,<1.0",
    "importlib_metadata>=4.11.4",
    "jsonschema>=4.20",
    "more-itertools>=10.0",
    "pydantic>=2.13,<3",
    "pyjwt>=2.13",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.30",
    "pyyaml>=6.0.3",
    "sqlglot>=30.0",
    "tomli>=2.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.8.0",
    "rapidfuzz>=3.0.0",
    "tabulate>=0.9.0",
    "typer>=0.12",
    "typing_extensions>=4.8",
    "uvicorn>=0.48.0",
    "lkml>=1.3.7",
]
