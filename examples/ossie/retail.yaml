version: "0.2.0.dev0"
semantic_model:
  - name: retail
    description: Example retail semantic model for Doris grounding.
    datasets:
      - name: orders
        source: sales.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: order_id
            datatype: Integer
          - name: amount
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: amount
            datatype: Decimal
            ai_context:
              synonyms: [revenue]
    metrics:
      - name: total_sales
        description: Sum of visible order amounts.
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount)
        datatype: Decimal
